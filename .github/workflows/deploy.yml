name: Deploy Rent Receipt CLI to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /opt/rent-receipt-cli

            # Restore ownership of source files to deploy user so git can overwrite them
            sudo chown -R $USER /opt/rent-receipt-cli
            # Re-give www-data ownership of runtime dirs/files
            sudo chown -R www-data /opt/rent-receipt-cli/storage /opt/rent-receipt-cli/var || true
            sudo chown www-data /opt/rent-receipt-cli/database.sqlite 2>/dev/null || true

            git fetch --prune origin
            git reset --hard origin/main

            composer install --no-dev --optimize-autoloader

            php bin/rent-receipt list --raw > /dev/null

            echo "DEPLOY OK"
          EOF

      - name: Migrate
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/rent-receipt-cli && script -q -c 'sudo -u www-data php bin/rent-receipt db:migrate' /dev/null"
