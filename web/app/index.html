<!DOCTYPE html>
<html lang="fr" data-theme="releve">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Régie locative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <div id="root"></div>

  <!-- React 18 (production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone for JSX (in-browser transform) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- API client + formatters (plain JS, no JSX) -->
  <script src="/app/api.js"></script>

  <!-- UI components (JSX, order matters) -->
  <script type="text/babel" data-presets="react" src="/app/components.jsx"></script>
  <script type="text/babel" data-presets="react" src="/app/process.jsx"></script>
  <script type="text/babel" data-presets="react" src="/app/screens.jsx"></script>
  <script type="text/babel" data-presets="react" src="/app/screens2.jsx"></script>
  <script type="text/babel" data-presets="react" src="/app/app.jsx"></script>
</body>
</html>
